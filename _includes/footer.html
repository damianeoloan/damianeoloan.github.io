<footer class="site-footer">
  <div class="footer-container">
    <span class="footer-heading">{{ site.display_name | append: " | Uí Luain, de Lyon, Julius, JoLuo, 劉, 魯... Tuath Dé de Naan" }}</span>

    <nav class="footer-nav">
      {% for link in site.data.nav-links %}
        <a href="{{ link.url | prepend: site.baseurl }}">
          {{ link.name | downcase }}
        </a>
      {% endfor %}
    </nav>

    {% if site.search %}
      {% include search.html %}
    {% endif %}

    <a href="https://github.com/damianeoloan/damianeoloan.github.io" target="_blank">    
      <p class="copyright">{{ site.time | date: '%Y' | prepend: 'Built on Jekyll, ' }}</p>
    </a>
    &#9769;
</footer>
