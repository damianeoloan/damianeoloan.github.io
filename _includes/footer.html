<footer class="site-footer">
  <div class="footer-container">
    <span class="footer-heading">{{ site.display_name }}</span>

    <nav class="footer-nav">
      {% for link in site.data.nav-links %}
        <a href="{{ link.url | prepend: site.baseurl }}">
          {{ link.name | downcase }}
        </a>
      {% endfor %}
    </nav>

    {% if site.search %}
      {% include search.html %}
    {% endif %}

    <a href="https://damianeoloan.github.io/" target="_blank">    
      <p class="copyright">{{ site.time | date: '%Y' | prepend: 'Source. Built on Jekyll, ' }}</p>
    </a>
</footer>
